# Documentation site — build with `pip install -r requirements-docs.txt && zensical build --strict`,
# preview with `zensical serve`. Deployed to GitHub Pages by .github/workflows/docs.yml.
[project]
site_name = "MultiAgentEngine"
site_description = "A loop of coding agents that implements, tests and audits your spec until it is done."
site_url = "https://miltonjoel.github.io/MultiAgentEngine/"
repo_url = "https://github.com/MiltonJoel/MultiAgentEngine"
repo_name = "MiltonJoel/MultiAgentEngine"
edit_uri = "edit/master/docs/"
copyright = "© 2026 MiltonJoel — MIT License"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guide" = [
    { "Plan and spec" = "guide/plan-and-spec.md" },
    { "Dashboard (mae-ui)" = "guide/dashboard.md" },
    { "Free models" = "guide/free-models.md" },
    { "CI, Docker and signals" = "guide/ci.md" },
  ] },
  { "Concepts" = [
    { "The loop" = "concepts/loop.md" },
    { "Checkpoints" = "concepts/checkpoints.md" },
    { "Cost and limits" = "concepts/cost.md" },
  ] },
  { "Reference" = [
    { "Command line" = "reference/cli.md" },
    { "Configuration" = "reference/config.md" },
    { "Run log" = "reference/run-log.md" },
    { "Roles, runners and prompts" = "reference/runners.md" },
  ] },
  { "Security" = "security.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Contributing" = "contributing.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
