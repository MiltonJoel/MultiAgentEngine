[project]
name = "multiagent-engine"
dynamic = ["version"]
description = "LangGraph loop driving coding agents (the claude and codex CLIs, or free models through Ollama or any OpenAI-compatible API) against a repo until a spec is implemented, tested and audited."
readme = "README.md"
license = "MIT"
authors = [{name = "MiltonJoel"}]
keywords = ["agents", "langgraph", "llm", "code-generation", "ollama", "claude", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# Model providers are not Python packages: install at least one of Ollama (free, local), the claude CLI or the codex CLI,
# or point the `api` runner at an OpenAI-compatible endpoint. The free-model runners use only the standard library.
requires-python = ">=3.10"
dependencies = ["langgraph>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/MiltonJoel/MultiAgentEngine"
Documentation = "https://miltonjoel.github.io/MultiAgentEngine/"
Source = "https://github.com/MiltonJoel/MultiAgentEngine"
Issues = "https://github.com/MiltonJoel/MultiAgentEngine/issues"
Changelog = "https://github.com/MiltonJoel/MultiAgentEngine/blob/master/CHANGELOG.md"

[project.scripts]
mae = "engine.main:main"
mae-ui = "engine.ui:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# engine.prompts here is the data directory engine/prompts/*.md (no __init__.py); `import engine.prompts` still
# resolves to the module engine/prompts.py, which takes precedence over a namespace directory of the same name.
packages = ["engine", "engine.nodes", "engine.prompts"]

[tool.setuptools.dynamic]
version = {attr = "engine.__version__"}

[tool.setuptools.package-data]
engine = ["ui.html", "py.typed"]
"engine.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit security checks
    "SIM",      # simplifications
    "RUF",      # ruff-specific
    "PL",       # pylint subset
]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # complexity/magic numbers: style, not bugs
    "PLW0603",  # module-level state is deliberate (runlog sink, llm config)
    "PLC0415",  # local imports break the graph <-> tester cycle on purpose
    "S603", "S607",  # running subprocesses is the engine's whole job; inputs are argv lists, never shells
    "S310",     # urlopen: every URL is checked to be http(s) in llm._request before it is opened
    "SIM105",   # try/except/pass reads clearer than contextlib.suppress in the hot paths
    "RUF001", "RUF002", "RUF003",  # the prose uses en/em dashes and arrows on purpose
    "B904",     # `raise X from exc` noise on CLI-facing SystemExit/RuntimeError messages
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S602", "S604", "PLR", "B011", "SIM", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["engine"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
